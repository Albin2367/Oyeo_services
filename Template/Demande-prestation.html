<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demander une Prestation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #fbfbfa;
        }
        h1, .serif-font {
            font-family: 'Cormorant Garamond', serif;
        }
        .hero-bg {
            background-image: linear-gradient(rgba(44, 53, 64, 0.65), rgba(44, 53, 64, 0.65)), url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
        }
        /* Style des placeholders et champs pour correspondre aux nuances beiges de l'image */
        .input-custom {
            background-color: #f7f4f0;
            border: 1px solid #eeebe6;
            color: #4a4a4a;
        }
        .input-custom:focus {
            outline: none;
            border-color: #c5a880;
            background-color: #ffffff;
        }
        .input-custom::placeholder {
            color: #a39f99;
        }
    </style>
</head>
<body class="text-gray-800 antialiased pb-16">

    <div class="hero-bg text-white text-center py-20 px-4">
        <span class="text-[10px] uppercase tracking-[0.2em] text-amber-500 font-semibold block mb-2">FORMULAIRE</span>
        <h1 class="text-4xl md:text-5xl font-light mb-4">Demander une Prestation</h1>
        <div class="w-12 h-[1px] bg-amber-500 mx-auto mb-5"></div>
        <p class="text-xs md:text-sm text-gray-200 max-w-xl mx-auto font-light leading-relaxed">
            Remplissez ce formulaire pour exprimer votre besoin. Nous reviendrons vers vous dans les 24 heures.
        </p>
    </div>

    <div class="max-w-3xl mx-auto px-4 mt-12">
        <div class="bg-white p-6 md:p-10 rounded-2xl border border-gray-100 shadow-sm">
            
            <form action="#" method="POST" class="space-y-5">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-2">Prénom *</label>
                        <input type="text" placeholder="Votre prénom" required class="w-full px-4 py-3 text-sm rounded-xl input-custom transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-2">Nom *</label>
                        <input type="text" placeholder="Votre nom" required class="w-full px-4 py-3 text-sm rounded-xl input-custom transition-all">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-2">Téléphone *</label>
                        <input type="tel" placeholder="+33 1 23 45 67 89" required class="w-full px-4 py-3 text-sm rounded-xl input-custom transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-2">Email *</label>
                        <input type="email" placeholder="votre@email.com" required class="w-full px-4 py-3 text-sm rounded-xl input-custom transition-all">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-2">Ville *</label>
                        <input type="text" placeholder="Paris, Neuilly..." required class="w-full px-4 py-3 text-sm rounded-xl input-custom transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-2">Adresse ou Zone *</label>
                        <input type="text" placeholder="Votre adresse" required class="w-full px-4 py-3 text-sm rounded-xl input-custom transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-2">Service Souhaité *</label>
                    <div class="relative">
                        <select required class="w-full px-4 py-3 text-sm rounded-xl input-custom transition-all appearance-none cursor-pointer">
                            <option value="" disabled selected hidden>Sélectionnez un service</option>
                            <option value="menage">Ménage & Entretien</option>
                            <option value="conciergerie">Conciergerie Privée</option>
                            <option value="garde">Garde d'enfants</option>
                            <option value="autre">Autre prestation</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                            <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-2">Date Souhaitée</label>
                        <input type="date" class="w-full px-4 py-3 text-sm rounded-xl input-custom transition-all cursor-pointer text-gray-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-2">Horaire Souhaité</label>
                        <input type="time" class="w-full px-4 py-3 text-sm rounded-xl input-custom transition-all cursor-pointer text-gray-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-2">Budget Prévu (optionnel)</label>
                    <input type="text" placeholder="Ex: 50 €" class="w-full px-4 py-3 text-sm rounded-xl input-custom transition-all">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-2">Description de votre besoin</label>
                    <textarea placeholder="Décrivez votre demande en détail..." rows="4" class="w-full px-4 py-3 text-sm rounded-xl input-custom transition-all resize-none"></textarea>
                </div>

                <div class="flex items-start pt-2">
                    <input id="consent" type="checkbox" required class="mt-1 h-4 w-4 rounded border-gray-300 text-slate-900 focus:ring-slate-900 cursor-pointer accent-slate-900">
                    <label for="consent" class="ml-3 text-[11px] text-gray-500 leading-normal cursor-pointer select-none">
                        J'accepte d'être contacté par Privée Services concernant ma demande. Vos données restent confidentielles.
                    </label>
                </div>

                <div class="pt-4">
                    <button type="submit" class="w-full bg-[#1d273b] hover:bg-[#28354f] text-white text-sm font-medium py-4 rounded-xl transition-colors tracking-wide flex items-center justify-center space-x-2">
                        <span>Envoyer ma demande</span>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4 transform rotate-45 -mt-0.5">
                            <path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z" />
                        </svg>
                    </button>
                </div>

            </form>
        </div>
    </div>

</body>
</html>
